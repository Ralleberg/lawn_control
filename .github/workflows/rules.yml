name: Lawn rules

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  rules:
    name: Rule regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Check syntax
        run: python3 -m compileall -q custom_components tests
      - name: Check lawn protection rules
        run: python3 -m unittest discover -s tests -v
